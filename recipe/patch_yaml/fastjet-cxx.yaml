# fastjetConfig.cmake calls find_package(siscone REQUIRED); from siscone 3.1.3 build 1 on,
# SISCone's CMake files are only in siscone-devel (conda-forge/siscone-feedstock#26).
if:
  name: fastjet-cxx-devel
  has_depends: siscone
  not_has_depends: siscone-devel*
  timestamp_lt: 1790946868000
then:
  - add_depends: siscone-devel
