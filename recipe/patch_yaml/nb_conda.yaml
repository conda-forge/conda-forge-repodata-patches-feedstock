# nb_conda is not compatible with notebook >=7.0.0, see
# https://github.com/conda-forge/nb_conda-feedstock/issues/21
# https://github.com/conda-forge/nb_conda-feedstock/pull/22
if:
  name: nb_conda
  timestamp_lt: 2024-01-02T14:34:46Z
then:
  - replace_depends:
      old: notebook >=4.2.0
      new: ${old},<7.0.0
  - replace_depends:
      old: notebook >=4.3.1
      new: ${old},<7.0.0
