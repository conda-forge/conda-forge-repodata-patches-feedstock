# jupyter_client <8.6.3 calls datetime.strptime("1", "%d") at import time,
# which raises ValueError on python 3.15
# see https://github.com/python/cpython/issues/70647
if:
  name: jupyter_client
  version_lt: 8.6.3
  timestamp_lt: 2026-11-27T17:04:00Z
then:
  - tighten_depends:
      name: python
      upper_bound: "3.15"
