---
# from this bit of code
# if record_name == "pyarrow" and record.get('timestamp', 0) < 1675198779000:
#     # pyarrow builds done with numpy<1.16.6 are incompatible with numpy 1.20
#     # We have been building with numpy 1.16.6 since 1612266172867
#     # The underlying issue is https://github.com/numpy/numpy/issues/17913
#     if record.get('timestamp', 0) < 1607959235411 and any(dep.split(' ')[0] == 'numpy'
#         for dep in record.get('depends', ())):
#         _pin_stricter(fn, record, "numpy", "x", "1.20")
if:
  name: pyarrow
  timestamp_lt: 2020-12-14T15:20:35.411Z  # smaller of the two stamps above
  has_depends: numpy?( *)
then:
  - tighten_depends:
      name: numpy
      max_pin: x
      upper_bound: "1.20"
---
# pyarrow 26 requires NumPy >=2.0 when numpy is installed (numpy stays optional):
# pyarrow/lib.pyx raises "ImportError: pyarrow requires NumPy 2.0 or newer".
# The pyarrow-feedstock recipe ignores numpy's run-export and hard-codes the
# run_constrained `numpy >=1.23,<3`, which the 26.0.0 builds kept. Solvers
# therefore pair pyarrow-core 26.0.0 with numpy 1.x and `import pyarrow` fails.
# https://github.com/apache/arrow/issues/48473
# https://github.com/apache/arrow/blob/apache-arrow-26.0.0/python/pyarrow/lib.pyx#L40-L44
if:
  name: pyarrow-core
  version: 26.0.0
  timestamp_le: 2026-11-02T21:10:01+01:00
then:
  - replace_constrains:
      old: numpy >=1.23,<3
      new: numpy >=2.0,<3
