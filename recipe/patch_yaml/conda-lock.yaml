# from this bit of code
# if record_name == "conda-lock" and record.get("timestamp", 0) < 1685186303000:
#     assert "constrains" not in record
#     record["constrains"] = ["urllib3 <2"]
if:
  name: conda-lock
  timestamp_lt: 2023-05-27T11:18:23Z
  not_has_constrains: "*"
then:
  - add_constrains: urllib3 <2
---
# change in output of json from mamba
# https://github.com/conda/conda-lock/pull/935
if:
  name: conda-lock
  version_le: "4.0.2"
then:
  - add_constrains:
      - mamba <2.9.0a0
      - micromamba <2.9.0a0
