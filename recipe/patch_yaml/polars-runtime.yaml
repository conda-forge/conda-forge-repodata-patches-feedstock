# polars 2.0.0 references statx (glibc >=2.28) but build 0 was linked against the
# 2.17 sysroot, so it claims glibc 2.17 support while failing to import there.
# https://github.com/conda-forge/polars-feedstock/issues/396
# https://github.com/pola-rs/polars/issues/29800
if:
  name_in:
    - polars-runtime-32
    - polars-runtime-64
    - polars-runtime-compat
  version: 2.0.0
  build_number: 0
  subdir_in:
    - linux-64
    - linux-aarch64
  timestamp_lt: 1791450934000
then:
  - replace_depends:
      old: __glibc >=2.17,<3.0.a0
      new: __glibc >=2.28,<3.0.a0
  - replace_constrains:
      old: __glibc >=2.17
      new: __glibc >=2.28
