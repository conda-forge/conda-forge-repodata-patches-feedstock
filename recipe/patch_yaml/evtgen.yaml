# evtgen builds made against hepmc3 3.2.x link libHepMC3.so.3, but the
# recipe's `pin_compatible('hepmc3')` in run: only capped hepmc3 below 4.
# hepmc3 3.3.0 changed the soname to libHepMC3.so.4, so these builds resolve
# next to hepmc3 3.3.x and then fail to load libEvtGen. Cap them below 3.3.
if:
  name: evtgen
  has_depends: hepmc3 >=3.2.*,<4.0a0
  timestamp_lt: 1760000000000
then:
  - tighten_depends:
      name: hepmc3
      upper_bound: 3.3.0
---
# evtgen builds made against hepmc3 3.3.0 link libHepMC3.so.4 but still
# depend on `hepmc3 >=3.3.0,<4.0a0`. Since 3.3.1, hepmc3's run_exports pin
# to x.x (`<3.4.0a0`) because the soname can change between minor versions.
# Cap these builds the same way.
if:
  name: evtgen
  has_depends: hepmc3 >=3.3.*,<4.0a0
  timestamp_lt: 1760000000000
then:
  - tighten_depends:
      name: hepmc3
      upper_bound: 3.4.0
