      name: mamba
      upper_bound: "0.15"
---
# https://github.com/mamba-org/boa/issues/392
if:
  name: boa
  timestamp_le: 2024-02-08T22:55:32.930Z
  version_in: ["0.15.0", "0.15.1", "0.16.0"]
then:
  - tighten_depends:
      name: conda-build
      upper_bound: "24.1"
---
# https://github.com/conda-forge/boa-feedstock/issues/81
if:
  name: boa
  timestamp_le: 2024-03-31T09:07:53.301Z
  version: "0.17.0"
then:
  - add_depends: boltons
  - add_depends: "conda >=23.3"
