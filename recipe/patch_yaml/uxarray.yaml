# this patch fixes incorrect python constraints in uxarray
# https://github.com/conda-forge/uxarray-feedstock/issues/89
if:
  name: uxarray
  version_ge: "2024.12.0"
  version_le: "2025.01.0"
  timestamp_lt: 2025-01-25T21:21:00Z
then:
  - replace_depends:
      old: python >=3.9
      new: python >=3.10
---
# this patch adds the matplotlib-base <3.11 constraint to older uxarray builds
# that were released without it
# https://github.com/conda-forge/uxarray-feedstock/issues/140
# https://github.com/UXARRAY/uxarray/issues/1542
if:
  name: uxarray
  version_le: "2026.08.0"
  timestamp_lt: 2026-09-18T09:52:46Z
then:
  - replace_depends:
      old: matplotlib-base
      new: matplotlib-base <3.11
