if:
  name: onnx
  version: "1.12.0"
  build: "*_0"
then:
  - replace_depends:
      old: protobuf
      new: protobuf >=3.12.2,<=3.20.1
---
# The onnx python package registers the protobuf descriptors that are compiled
# into libonnx, so the two only work together when they come from the same
# build of the onnx-feedstock. onnx already depends on the exact libonnx build,
# but nothing stopped an older onnx from being kept in place while libonnx was
# updated, or from being co-installed with a libonnx that something else (e.g.
# onnxruntime) pulled in. This is the missing direction of that pairing, and it
# also rules out onnx 1.22.0 builds 0 and 1, which still carried their own copy
# of the descriptors.
# The build string is matched by build number only because onnx is built once
# per python version while libonnx is not python specific.
# Added to the recipe in conda-forge/onnx-feedstock#165.
if:
  name: libonnx
  not_has_constrains: "onnx?( *)"
  timestamp_lt: 2026-09-21T01:14:49Z
then:
  - add_constrains: onnx ==${version} *_${build_number}
---
# libonnx on win-64 imports absl::lts_20260526 symbols, from libprotobuf.dll on
# all versions and also from abseil_dll.dll on 1.23, but libabseil was not in
# the recipe's host section, so these builds do not depend on it. They only pin
# libprotobuf to a patch version, and libprotobuf 7.35.1 was later rebuilt for
# abseil 20260817, so a solver can pair them with the new abseil ("DLL load
# failed while importing onnx_cpp2py_export: The specified procedure could not
# be found"). libonnx on linux and macOS has no undefined abseil symbols.
# Added to the recipe in conda-forge/onnx-feedstock#173.
if:
  name: libonnx
  subdir_in: win-64
  has_depends: libprotobuf >=7.35.1,<7.35.2.0a0
  timestamp_lt: 2026-10-27T03:45:00Z
then:
  - add_depends: libabseil >=20260526.0,<20260527.0a0
---
# onnx 1.22.0 build 1 predates libonnx and has the same problem, through its own
# imports from libprotobuf-lite.dll.
if:
  name: onnx
  subdir_in: win-64
  version: 1.22.0
  build_number: 1
  has_depends: libprotobuf >=7.35.1,<7.35.2.0a0
  timestamp_lt: 2026-10-27T03:45:00Z
then:
  - add_depends: libabseil >=20260526.0,<20260527.0a0
