# yaml-language-server: $schema=../patch_yaml_model.json
# PyVBMC 1.0.4 and every earlier release depend on `gpyreg >=0.1.0` and `numpy >=1.22.1`
# without an upper bound, and fail with later releases of both:
#   * gpyreg 1.3.0 refuses a prior on a hyperparameter that the GP does not have. On a
#     noisy target whose noise level the target does not return (`uncertainty_handling`
#     set without `specify_target_noise`), pyvbmc/vbmc/gaussian_process_train.py sets a
#     prior on `noise_provided_log_multiplier`, which its GP lacks, so the run stops at its
#     first GP fit with `ValueError: Unknown hyperparameter(s) in priors`. Verified with
#     pyvbmc 1.0.4 and numpy 2.3.5: fails with gpyreg 1.4.0, completes with gpyreg 1.0.2.
#   * numpy 2.4 refuses to store an array of one element as an element of another array.
#     Once GP hyperparameter sampling stops (after 200 + 10 * D evaluations), `_gp_log_joint`
#     in pyvbmc/vbmc/variational_optimization.py keeps a sample axis on the variance of the
#     ELBO, and the run stops with `ValueError: setting an array element with a sequence`.
# PyVBMC 1.5 fixes both. The code involved is the same from 0.9.0 to 1.0.4, so every
# release is patched: patching 1.0.4 alone would move the solver onto an earlier one.
if:
  name: pyvbmc
  version_le: "1.0.4"
  timestamp_lt: 1791439565000
then:
  - tighten_depends:
      name: gpyreg
      upper_bound: "1.3"
  - tighten_depends:
      name: numpy
      upper_bound: "2.4"
