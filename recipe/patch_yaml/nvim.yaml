# Past builds for nvim <=0.12.5 (build 0) incompatible with unibilium >=2.1.4,
# due to a fix in malformed SONAME;
# see https://github.com/conda-forge/nvim-feedstock/pull/56
if:
  name: nvim
  has_depends: "unibilium?( *)"
  timestamp_lt: 2026-08-24T04:03:33.485Z
then:
  - add_depends: "unibilium <2.1.4"
