# VulkanSceneGraph bumps its library SOVERSION (libvsg.so.N) in most patch
# releases, but the vulkanscenegraph-feedstock run_exports used an x.x pin, so
# dependents built against 1.1.X allow any VSG 1.1.* at runtime and fail to load
# libvsg when the SOVERSION differs. The feedstock moves its run_exports to an
# x.x.x pin (conda-forge/vulkanscenegraph-feedstock#19); this patch caps
# packages published before that change at the first VSG release with a
# different SOVERSION than the one they were built against.
#
# VSG_SOVERSION per upstream tag (CMakeLists.txt):
#   1.1.8 - 1.1.11: 14, 1.1.12 - 1.1.13: 15, 1.1.14: 16, 1.1.15 - 1.1.16: 17,
#   1.1.17: 18
#
# built against 1.1.8 or 1.1.9 (SOVERSION 14)
if:
  has_depends: "vulkanscenegraph >=1.1.[89],<1.2.0a0"
  timestamp_le: 2026-11-24T04:53:44-08:00
then:
  - tighten_depends:
      name: vulkanscenegraph
      upper_bound: "1.1.12"
---
# built against 1.1.10 or 1.1.11 (SOVERSION 14)
if:
  has_depends: "vulkanscenegraph >=1.1.1[01],<1.2.0a0"
  timestamp_le: 2026-11-24T04:53:44-08:00
then:
  - tighten_depends:
      name: vulkanscenegraph
      upper_bound: "1.1.12"
---
# built against 1.1.12 or 1.1.13 (SOVERSION 15)
if:
  has_depends: "vulkanscenegraph >=1.1.1[23],<1.2.0a0"
  timestamp_le: 2026-11-24T04:53:44-08:00
then:
  - tighten_depends:
      name: vulkanscenegraph
      upper_bound: "1.1.14"
---
# built against 1.1.14 (SOVERSION 16)
if:
  has_depends: "vulkanscenegraph >=1.1.14,<1.2.0a0"
  timestamp_le: 2026-11-24T04:53:44-08:00
then:
  - tighten_depends:
      name: vulkanscenegraph
      upper_bound: "1.1.15"
---
# built against 1.1.15 or 1.1.16 (SOVERSION 17)
if:
  has_depends: "vulkanscenegraph >=1.1.1[56],<1.2.0a0"
  timestamp_le: 2026-11-24T04:53:44-08:00
then:
  - tighten_depends:
      name: vulkanscenegraph
      upper_bound: "1.1.17"
