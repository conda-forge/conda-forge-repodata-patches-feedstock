# yaml-language-server: $schema=../patch_yaml_model.json
# cstar-forge <0.9 is the standalone C-Star Forge package. From cstar-ocean 0.15.0
# Forge is part of cstar-ocean itself, and installing an old cstar-forge next to
# it registers a second `cstar forge` CLI plugin and a second `forge` application
# that collide with the built-in ones (C-Star logs a name-conflict warning on every
# command). cstar-forge 0.9.0 is a compatibility shim requiring cstar-ocean >=0.15.0.
# Cap the existing builds to the last cstar-ocean series they were released against
# so the solver never pairs them with 0.15+.
# https://github.com/CWorthy-ocean/C-Star/pull/699
if:
  name: cstar-forge
  version_lt: "0.9.0a0"
  has_depends: cstar-ocean*
  timestamp_lt: 1790187946884  # 2026-09-23
then:
  - tighten_depends:
      name: cstar-ocean
      upper_bound: "0.15.0a0"
