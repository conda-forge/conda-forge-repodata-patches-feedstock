if:
  name: cuda-python
  version_ge: 12.0.0
  version_lt: 13.0.0
  timestamp_lt: 1706947200000
then:
  - remove_depends:
      - cuda-cudart*
  - add_constrains:
      - cuda-cudart >=12,<13.0a0
  - replace_depends:
      old: cuda-nvrtc*
      new: cuda-nvrtc >=12,<13.0a0
---
if:
  name: cuda-core
  version: 0.2.0
  build_number: 0
then:
  - remove_depends: "cuda-version >=12.8,<13"
---
# Fixes incorrect constraints
# https://github.com/conda-forge/cuda-python-feedstock/issues/205
if:
  name: cuda-python
  version: 13.3.0
  not_has_depends: cuda-core
  timestamp_lt: 1780272000000
then:
  - add_depends: cuda-core >=1.0.0,<1.1.0
---
# Fixes incorrect constraints
# https://github.com/conda-forge/cuda-python-feedstock/issues/205
if:
  name: cuda-python
  version: 13.4.1
  timestamp_lt: 1789584138000
then:
  - replace_depends:
      old: cuda-core >=1.0.0,<1.1.0
      new: cuda-core >=1.2.0,<1.3.0
